<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The 1200×630 card link previews show; screenshots.mjs captures it into public/og.png. -->
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(700px 420px at 92% 0%, #ffdca3 0%, transparent 65%), #fff8ee;
        color: #3a2417;
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
      }
      .brand {
        position: absolute;
        top: 64px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 800;
      }
      .brand img {
        width: 76px;
        height: 76px;
      }
      h1 {
        position: absolute;
        top: 180px;
        left: 72px;
        width: 560px;
        margin: 0;
        font-size: 58px;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      p {
        position: absolute;
        bottom: 64px;
        left: 72px;
        width: 520px;
        margin: 0;
        color: #7a5a43;
        font: 600 24px/1.4 system-ui, -apple-system, sans-serif;
      }
      .window {
        position: absolute;
        top: 150px;
        left: 680px;
        width: 760px;
        overflow: hidden;
        border: 1px solid #f0dcc0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 30px 60px -24px rgba(122, 72, 20, 0.45);
      }
      .bar {
        display: flex;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid #f0dcc0;
        background: #fff3e2;
      }
      .bar span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #f4a13a;
      }
      .bar span:nth-child(2) {
        background: #ffd45e;
      }
      .bar span:nth-child(3) {
        background: #5e8c31;
      }
      .window img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../src/assets/logo.svg" alt="" />Capybara</div>
    <h1>Debug React Native, Flutter and web apps from one place</h1>
    <p>Logs, network, storage and state, live. Free for macOS, Windows and Linux.</p>
    <div class="window">
      <div class="bar"><span></span><span></span><span></span></div>
      <img src="../src/assets/screenshots/network-light@2x.webp" alt="" />
    </div>
  </body>
</html>
