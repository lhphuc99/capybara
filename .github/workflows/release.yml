# npm trusted publishing is set up for this file name: rename it there too if it changes.
name: Release

on:
  push:
    branches: [main]

# Each job asks for what it needs, so only the publish job can get an npm token.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: select-mode
        uses: changesets/action/select-mode@v2

  # With changesets on main: open or update the "version packages" pull request.
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: changesets/action/version@v2
        with:
          script: npm run version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  # Once that pull request is merged: build, test and pack what isn't on npm yet.
  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags such as capybara-devtools@0.2.0
      id-token: write # npm trusted publishing, which needs npm 11.5.1 or later (Node 24 has it)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # No install scripts in the one job that can publish.
      - run: npm ci --ignore-scripts
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          # The GitHub release, with the desktop installers, comes from `npm run desktop:release`.
          create-github-releases: false
