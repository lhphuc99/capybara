name: capybara_devtools
description: "See a Flutter app's logs, errors, network, storage and state in Capybara, the local devtools for React Native, Flutter and web apps."
version: 0.1.0
homepage: https://capybara.lhphuc.com
repository: https://github.com/lhphuc99/capybara/tree/main/dart/packages/capybara_devtools
issue_tracker: https://github.com/lhphuc99/capybara/issues
topics: [devtools, debugging, logging, network, flutter]

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
